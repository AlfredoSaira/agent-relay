# Holds credentials so they don't sit in plain text inside the Deployments.
# For a real cluster these values would come from a secret manager, not a
# committed file -- this is a local/kind-only convenience.
apiVersion: v1
kind: Secret
metadata:
  name: agent-relay-secrets
type: Opaque
stringData:
  POSTGRES_USER: agent_relay
  POSTGRES_PASSWORD: agent_relay
  POSTGRES_DB: agent_relay
  # Hostname "postgres" matches the Postgres Service name below -- inside the
  # cluster, a Service name works as a DNS address, the same role
  # "postgres" played in compose.yaml.
  RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@postgres:5432/agent_relay
