name: CI

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: agent-relay
  KIND_CLUSTER: agent-relay

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_relay
          POSTGRES_PASSWORD: agent_relay
          POSTGRES_DB: agent_relay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent_relay -d agent_relay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Run unit tests (SQLite, in-process)
        run: uv run pytest -q test_agent_relay.py

      - name: Run integration tests (real HTTP server, PostgreSQL)
        run: uv run pytest -q tests/integration
        env:
          RELAY_DATABASE_URL: postgresql+psycopg://agent_relay:agent_relay@localhost:5432/agent_relay

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Compute a unique image tag for this commit
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: docker build -t "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" .

      - name: Save image so the deploy job can load it without a registry
        run: docker save "$IMAGE_NAME:${{ steps.tag.outputs.tag }}" -o /tmp/agent-relay-image.tar

      - uses: actions/upload-artifact@v4
        with:
          name: agent-relay-image
          path: /tmp/agent-relay-image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-relay-image
          path: /tmp

      - name: Load the built image into this runner's Docker
        run: docker load -i /tmp/agent-relay-image.tar

      - name: Install kind and kubectl
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.30.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          curl -Lo ./kubectl "https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl"
          chmod +x ./kubectl
          sudo mv ./kubectl /usr/local/bin/kubectl

      - name: Create the kind cluster if it doesn't exist yet
        # A hosted GitHub Actions runner starts with no kind cluster at all,
        # unlike a developer's machine that may already have one from
        # earlier local testing -- so this has to be idempotent, not assume
        # either state.
        run: |
          if ! kind get clusters | grep -qx "$KIND_CLUSTER"; then
            kind create cluster --name "$KIND_CLUSTER"
          fi
          kind export kubeconfig --name "$KIND_CLUSTER"
          kubectl wait --for=condition=Ready node --all --timeout=90s

      - name: Load the image into the kind cluster
        run: kind load docker-image "$IMAGE_NAME:${{ needs.build.outputs.image_tag }}" --name "$KIND_CLUSTER"

      - name: Apply base manifests (safe to re-apply; no-ops if unchanged)
        run: |
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/agent-relay.yaml

      - name: Roll out the new image
        run: |
          kubectl set image deployment/agent-relay "agent-relay=$IMAGE_NAME:${{ needs.build.outputs.image_tag }}"
          if ! kubectl rollout status deployment/agent-relay --timeout=120s; then
            echo "Rollout did not become healthy in time -- rolling back to the previous version instead of leaving a broken deploy running."
            kubectl rollout undo deployment/agent-relay
            kubectl rollout status deployment/agent-relay --timeout=120s
            exit 1
          fi
